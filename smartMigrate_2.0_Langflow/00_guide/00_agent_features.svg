<title id="title">SmartMigrate · 주요 기능</title><desc id="desc">자연어 요청을 일반 대화, Management, 작업 실행으로 구분. 템플릿 제공, 매핑룰 등록과 실행별 생성 SQL 및 검증 기준을 정리한 16:9 장표.</desc>
