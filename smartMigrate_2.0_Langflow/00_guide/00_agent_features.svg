<text x="1355" y="720" fill="#243447" font-size="20" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">동일 BIND_SET 사용 (최대 3개)</text>
<text x="1355" y="749" fill="#243447" font-size="20" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">각 케이스: FROM_COUNT = TO_COUNT &gt; 0</text>
