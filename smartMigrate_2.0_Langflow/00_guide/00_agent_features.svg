<text x="667" y="392" fill="#246a89" font-size="16" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">STEP 1</text>
<text x="667" y="423" fill="#246a89" font-size="22" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">DB Migration</text>
<text x="667" y="451" fill="#516176" font-size="17" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">이관 · 실행 · 검증</text>
<text x="855" y="396" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">MIG_SQL · INSERT INTO … SELECT …</text>
<text x="855" y="425" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">VERIFY_SQL · 원천 / 대상 건수 비교</text>
<text x="855" y="454" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">VERIFY2_SQL · PK 기준 레코드 비교</text>
<text x="855" y="483" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">매핑 + DDL 기반 생성 · INSERT 실행</text>
<text x="1355" y="396" fill="#243447" font-size="20" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">전체 행 수 + 비교 컬럼 COUNT 대조</text>
<text x="1355" y="425" fill="#243447" font-size="20" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">SUCCESS_YN=&#x27;Y&#x27; · 모든 DIFF_*=0</text>
<text x="1355" y="454" fill="#243447" font-size="20" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">PK로 연결한 비교 대상 컬럼 값 대조</text>
<text x="1355" y="483" fill="#243447" font-size="20" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">MISMATCH_CNT=0 → PASS</text>
