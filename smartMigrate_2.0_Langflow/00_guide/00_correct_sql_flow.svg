<path d="M 612 694 H 641" fill="none" stroke="#6554a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="665" y="681" fill="#6554a4" font-size="25" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">LLM: Generate TEST_SQL</text>
<text x="665" y="712" fill="#516176" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">Reuse: BIND_SQL + BIND_SET</text>
<rect x="80" y="765" width="250" height="90" rx="12" fill="#ffffff" stroke="#6554a4"/>
<rect x="370" y="765" width="235" height="90" rx="12" fill="#ffffff" stroke="#6554a4"/>
<rect x="650" y="765" width="490" height="90" rx="12" fill="#ffffff" stroke="#6554a4"/>
<text x="95" y="799" fill="#6554a4" font-size="25" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">TEST_SQL</text>
<text x="95" y="831" fill="#516176" font-size="18" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">Conversion 검증 완료 확인</text>
<text x="384" y="817" fill="#6554a4" font-size="22" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">PASS-CONVERSION</text>
<path d="M 337 809 H 361" fill="none" stroke="#6554a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 612 809 H 641" fill="none" stroke="#6554a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="665" y="796" fill="#6554a4" font-size="25" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">LLM: Generate TUNED_TO_SQL</text>
<text x="665" y="827" fill="#516176" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">Save: TUNED_RESULT (튜닝 내역)</text>
<rect x="1205" y="212" width="655" height="95" rx="12" fill="#f6f4fb" stroke="#ded6ee"/>
<text x="1225" y="246" fill="#6554a4" font-size="25" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">Correct SQL 저장 → 해당 종류 VectorDB 동기화</text>
<text x="1225" y="279" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">예: SQL_SEQ = 42 · TO_SQL / BIND_SQL / TEST_SQL</text>
<rect x="1205" y="335" width="655" height="109" rx="12" fill="#f6f4fb" stroke="#ded6ee"/>
<text x="1225" y="369" fill="#6554a4" font-size="25" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">현재 AS-IS SQL ↔ 후보 AS-IS SQL</text>
<text x="1225" y="402" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">COSINE 검색 · 유사도가 엄격히 80% 초과인 후보</text>
<rect x="1205" y="472" width="655" height="171" rx="12" fill="#f6f4fb" stroke="#ded6ee"/>
<text x="1225" y="505" fill="#6554a4" font-size="25" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">저장한 SQL 종류와 후보 실패 단계 일치</text>
<rect x="1225" y="520" width="615" height="31" fill="#e9e4f4"/>
<text x="1240" y="543" fill="#243447" font-size="21" font-weight="normal" font-family="Consolas, monospace">TO_SQL</text>
<text x="1450" y="543" fill="#6554a4" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">→</text>
<text x="1500" y="543" fill="#243447" font-size="21" font-weight="normal" font-family="Consolas, monospace">FAIL-TOBE</text>
<rect x="1225" y="555" width="615" height="31" fill="#ffffff"/>
<text x="1240" y="578" fill="#243447" font-size="21" font-weight="normal" font-family="Consolas, monospace">BIND_SQL</text>
<text x="1450" y="578" fill="#6554a4" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">→</text>
<text x="1500" y="578" fill="#243447" font-size="21" font-weight="normal" font-family="Consolas, monospace">FAIL-BIND</text>
<rect x="1225" y="590" width="615" height="31" fill="#e9e4f4"/>
<text x="1240" y="613" fill="#243447" font-size="21" font-weight="normal" font-family="Consolas, monospace">TEST_SQL</text>
<text x="1450" y="613" fill="#6554a4" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">→</text>
<text x="1500" y="613" fill="#243447" font-size="21" font-weight="normal" font-family="Consolas, monospace">FAIL-TEST</text>
<rect x="1205" y="671" width="655" height="116" rx="12" fill="#f6f4fb" stroke="#ded6ee"/>
<text x="1225" y="705" fill="#6554a4" font-size="25" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">일치 후보에 REF_SEQ = 42 자동 등록</text>
<text x="1225" y="738" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">RETRY_COUNT = 0 · 후보의 FAIL 상태는 유지</text>
<text x="1225" y="766" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">기준 작업 자신 제외 · 후보별 추가 승인 없이 반영</text>
<rect x="1205" y="815" width="655" height="102" rx="12" fill="#f6f4fb" stroke="#ded6ee"/>
<text x="1225" y="849" fill="#6554a4" font-size="25" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">별도 재실행 요청 → 실패 단계에서 생성 재개</text>
<text x="1225" y="882" fill="#243447" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">REF_SEQ의 Correct SQL을 생성 힌트로 사용</text>
<path d="M 1532 312 V 329" fill="none" stroke="#6554a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1532 449 V 466" fill="none" stroke="#6554a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1532 648 V 665" fill="none" stroke="#6554a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1532 792 V 809" fill="none" stroke="#6554a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="60" y="947" fill="#18334e" font-size="23" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">저장 공통: USER_EDITED = Y · RETRY_COUNT = 0 · 저장한 SQL 한 종류만 VectorDB 동기화</text>
<text x="60" y="994" fill="#516176" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">저장·참조 등록과 실행은 별도  |  DB 상태로 재개 단계 결정  |  Migration은 유사 작업 자동 REF_SEQ 적용 없음</text>
<text x="60" y="1038" fill="#516176" font-size="21" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">좌측 상태 = 보정한 기준 작업의 새 상태  /  우측 FAIL 단계 = 참조 SQL을 연결할 유사 후보의 현재 상태</text>
</svg>