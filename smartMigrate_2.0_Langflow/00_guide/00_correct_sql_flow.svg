<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">SmartMigrate · Correct SQL 입력과 후속 실행</title><desc id="desc">DB Migration과 SQL Conversion의 보정 SQL 저장 상태, 다음 실행 생성 단계, 유사 실패 작업 REF_SEQ 자동 등록 흐름.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="55" y="58" fill="#243447" font-size="30" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">SmartMigrate · Correct SQL 입력과 후속 실행</text>
<text x="55" y="103" fill="#516176" font-size="25" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">확인한 SQL을 저장해 해당 단계를 완료 처리하고, 다음 실행은 저장된 상태에 맞는 단계부터 재개</text>
<text x="60" y="156" fill="#18334e" font-size="27" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">01  SQL을 입력한 기준 작업</text>
<text x="1205" y="156" fill="#6554a4" font-size="26" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">02  유사 후보 작업 · SQL Conversion 전용</text>
<text x="80" y="194" fill="#516176" font-size="19" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">입력 SQL · 확인 의미</text>
