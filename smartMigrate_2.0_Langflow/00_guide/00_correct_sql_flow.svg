<rect x="370" y="650" width="235" height="90" rx="12" fill="#ffffff" stroke="#6554a4"/>
<rect x="650" y="650" width="490" height="90" rx="12" fill="#ffffff" stroke="#6554a4"/>
<text x="95" y="684" fill="#6554a4" font-size="20" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">BIND_SQL + BIND_SET</text>
<text x="95" y="716" fill="#516176" font-size="18" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">두 값을 함께 업데이트 · 필수</text>
<text x="384" y="702" fill="#6554a4" font-size="22" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">FAIL-TEST</text>
