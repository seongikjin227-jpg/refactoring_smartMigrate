<title id="title">SmartMigrate · RAG / Milvus 코드와 업무별 조회</title><desc id="desc">왼쪽은 Milvus 접속·동기화·검색 코드, 오른쪽은 DB Migration, SQL Conversion, SQL Tuning의 조회 경로와 공통 General 규칙.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="55" y="58" fill="#243447" font-size="30" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">SmartMigrate · RAG / Milvus 코드와 업무별 조회</text>
<text x="55" y="102" fill="#516176" font-size="25" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">Milvus 핵심 코드 + 조회 흐름도  |  무엇을 입력하고, 어떤 컬렉션과 비교하며, 무엇을 프롬프트에 반영하는가</text>
<text x="60" y="155" fill="#18334e" font-size="27" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">01  접속 · 동기화 · 검색 코드</text>
<text x="750" y="155" fill="#18334e" font-size="27" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">02  입력 → 조회·비교 대상 → 선택 결과</text>
<rect x="60" y="180" width="640" height="243" rx="13" fill="#f5f7fb" stroke="#d8e0eb"/>
<text x="82" y="215" fill="#246a89" font-size="24" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">MilvusClient · DB 접속</text>
<text x="82" y="246" fill="#516176" font-size="18" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">_milvus_config() → _milvus_client()</text>
<text x="82" y="284" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">from pymilvus import MilvusClient</text>
<text x="82" y="307" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">client = MilvusClient(</text>
<text x="82" y="330" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">    uri=cfg[&quot;uri&quot;], db_name=cfg[&quot;db_name&quot;],</text>
<text x="82" y="353" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">    user=cfg[&quot;username&quot;], password=cfg[&quot;password&quot;],</text>
<text x="82" y="376" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">    timeout=10,</text>
<text x="82" y="399" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">)</text>
<rect x="60" y="438" width="640" height="204" rx="13" fill="#f5f7fb" stroke="#d8e0eb"/>
<text x="82" y="473" fill="#357855" font-size="24" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">검색 자료 동기화</text>
<text x="82" y="504" fill="#516176" font-size="18" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">_sync_collection() · 변경분만 임베딩·upsert</text>
<text x="82" y="542" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">vectors = self._embed_texts(texts, embed_config)</text>
<text x="82" y="565" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">entities = [{**row, &quot;dense_vector&quot;: vector}</text>
<text x="82" y="588" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">            for row, vector in zip(rows, vectors)]</text>
<text x="82" y="611" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">client.upsert(collection_name=name, data=entities)</text>
<rect x="60" y="657" width="640" height="288" rx="13" fill="#f5f7fb" stroke="#d8e0eb"/>
<text x="82" y="692" fill="#6554a4" font-size="24" font-weight="bold" font-family="Segoe UI, Malgun Gothic, sans-serif">벡터 검색 · COSINE 유사도</text>
<text x="82" y="723" fill="#516176" font-size="18" font-weight="normal" font-family="Segoe UI, Malgun Gothic, sans-serif">유사 AS-IS 검색 예시 · 저장 벡터 재사용 가능</text>
<text x="82" y="761" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">vector = self._embed_texts([text], embed_config)[0]</text>
<text x="82" y="784" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">hits = client.search(</text>
<text x="82" y="807" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">    collection_name=cfg[&quot;asis_sql_collection&quot;],</text>
<text x="82" y="830" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">    data=[vector], anns_field=&quot;dense_vector&quot;,</text>
<text x="82" y="853" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">    filter=&quot;is_active == true&quot;, limit=20,</text>
<text x="82" y="876" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">    search_params={&quot;metric_type&quot;: &quot;COSINE&quot;},</text>
<text x="82" y="899" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace">)</text>
<text x="82" y="922" fill="#243447" font-size="18" font-weight="normal" font-family="Consolas, monospace"># query() / query_iterator(): 벡터 순위 없는 조건 조회</text>
