          , \"SQL 서식 정리해줘\"]\n                lines = [\"### 이관 실행 예상\", \"\", \"| 매핑 ID | 추가 예상 | 갱신 예상 | 동일 예상 |\",\n  \
          \                       \"| --- | --- | --- | --- |\"]\n                lines += [\"| {MAP_ID} | {inserted} | {updated}\
          \ | {unchanged} |\".format(**item) for item in preview]\n                lines += [\"\", \"현재 데이터로 계산한 예상입니다. 실제\
