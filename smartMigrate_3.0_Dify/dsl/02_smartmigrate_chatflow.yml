          \ dict):\n            continue\n        data = log_entry.get(\"data\")\n        if (isinstance(data, dict) and str(log_entry.get(\"\
          label\", \"\")).startswith(\"CALL \")\n                and data.get(\"tool_name\") in (\"smartmigrate_execute\"\
          , \"smart_migrate_tool\")):\n            # Official ReAct stores the CALL output directly in data.output.\n    \
          \        found.append(data.get(\"output\"))\n        output = data.get(\"output\") if isinstance(data, dict) else\
          \ None\n        if not isinstance(output, dict):\n            continue\n        responses = output.get(\"tool_responses\"\
          , [])\n        if not isinstance(responses, list):\n            responses = []\n        for response in [output]\
          \ + responses:\n            if isinstance(response, dict) and response.get(\"tool_call_name\") in (\"smartmigrate_execute\"\
          , \"smart_migrate_tool\"):\n                found.append(response.get(\"tool_response\"))\n    return found\n\n\n\
          def commit_result(state_json: str, request_id: str, agent_json: list, agent_text: str, execution_json: str = None)\
          \ -> dict:\n    before = validate(json.loads(state_json))\n    found = []\n    sources = [execution_json] if execution_json\
          \ is not None else tool_responses(agent_json)\n    for response in sources:\n        for item in envelopes(response):\n\
          \            if item.get(\"request_id\") == request_id:\n                found.append(item)\n    unique = {dumps(item):\
          \ item for item in found}\n    if not unique:\n        responses = tool_responses(agent_json)\n        empty_round\
          \ = any(isinstance(e, dict) and isinstance(e.get(\"data\"), dict)\n                          and isinstance(e[\"\
          data\"].get(\"output\"), dict)\n                          and e[\"data\"][\"output\"].get(\"llm_response\") == \"\
          \"\n                          and e[\"data\"][\"output\"].get(\"tool_responses\") == [] for e in (agent_json or\
          \ []))\n        if responses:\n            message = \"Tool 응답은 수신했지만 현재 요청의 result_json 실행 결과를 찾지 못했습니다. 01 Workflow의\
