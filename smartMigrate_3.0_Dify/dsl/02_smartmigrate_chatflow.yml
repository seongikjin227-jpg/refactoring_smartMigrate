        code: "\"\"\"Dify Code node: standard library only, JSON tables, no database or network.\n\nThe builder embeds this\
          \ whole file in the execute node. Do not import local modules.\n\"\"\"\nimport copy\nimport base64\nimport hashlib\n\
          import json\nimport re\n\nMAX_STATE = 180000\nMAX_ROWS = 200\nRESULT_KIND = \"smartmigrate.result.v1\"\nTABLE_INPUTS\
          \ = {name: name.lower() + \"_json\" for name in (\n    \"ASIS_HR_DEPT\", \"ASIS_HR_EMP\", \"TOBE_HR_DEPT\", \"TOBE_HR_EMP\"\
          , \"NEXT_MIG_INFO\",\n    \"NEXT_MIG_INFO_DTL\", \"NEXT_SQL_INFO\", \"NEXT_MIG_RAG_INFO\", \"NEXT_MIG_LOG\")}\n\n\
          \ndef dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(\",\", \":\"), allow_nan=False)\n\
          \n\ndef digest(value):\n    canonical = json.dumps(value, ensure_ascii=False, separators=(\",\", \":\"), sort_keys=True,\
          \ allow_nan=False)\n    return hashlib.sha256(canonical.encode(\"utf-8\")).hexdigest()\n\n\ndef table(state, name):\n\
          \    if name not in state[\"tables\"]:\n        raise ValueError(\"없는 테이블: \" + str(name))\n    return state[\"\
          tables\"][name]\n\n\ndef rows(state, name):\n    return table(state, name)[\"rows\"]\n\n\ndef validate(state):\n\
          \    if not isinstance(state, dict) or state.get(\"schema_version\") != 1:\n        raise ValueError(\"schema_version=1인\
          \ 샘플 JSON이 필요합니다.\")\n    if not isinstance(state.get(\"revision\"), int) or state[\"revision\"] < 0:\n        raise\
          \ ValueError(\"revision은 0 이상의 정수여야 합니다.\")\n    if not isinstance(state.get(\"tables\"), dict):\n        raise\
          \ ValueError(\"tables 객체가 필요합니다.\")\n    names = (\"NEXT_MIG_INFO\", \"NEXT_MIG_INFO_DTL\", \"NEXT_SQL_INFO\", \"\
          NEXT_MIG_RAG_INFO\", \"NEXT_MIG_LOG\")\n    for name in names:\n        table(state, name)\n    for name, spec in\
          \ state[\"tables\"].items():\n        if not isinstance(spec, dict):\n            raise ValueError(name + \": 테이블\
          \ 정의 오류\")\n        cols, data = spec.get(\"columns\"), spec.get(\"rows\")\n        if not isinstance(cols, list)\
          \ or not cols or not all(isinstance(c, str) for c in cols) or len(set(cols)) != len(cols):\n            raise ValueError(name\
          \ + \": columns 오류\")\n        if not all(isinstance(c, str) and re.fullmatch(r\"[A-Z][A-Z0-9_]*\", c) for c in\
          \ cols):\n            raise ValueError(name + \": 컬럼명 오류\")\n        if not isinstance(data, list) or len(data)\
          \ > MAX_ROWS:\n            raise ValueError(name + \": 행 수 제한 200\")\n        keys = spec.get(\"primary_key\", [])\n\
          \        if not isinstance(keys, list) or not keys or not all(isinstance(k, str) for k in keys) or not set(keys)\
          \ <= set(cols):\n            raise ValueError(name + \": primary_key 오류\")\n        seen = set()\n        for row\
          \ in data:\n            if not isinstance(row, dict) or set(row) - set(cols):\n                raise ValueError(name\
          \ + \": 선언하지 않은 컬럼\")\n            if any(isinstance(v, (dict, list)) for v in row.values()):\n                raise\
          \ ValueError(name + \": 셀은 문자열/숫자/null/bool만 지원\")\n            key = tuple(row.get(k) for k in keys)\n        \
          \    if any(v is None for v in key) or key in seen:\n                raise ValueError(name + \": 중복 또는 빈 키 \" +\
          \ str(key))\n            seen.add(key)\n    required = {\"NEXT_MIG_INFO\": {\"MAP_ID\", \"FR_TABLE\", \"TO_TABLE\"\
          , \"STATUS\", \"USE_YN\"},\n                \"NEXT_MIG_INFO_DTL\": {\"MAP_ID\", \"MAP_DTL\", \"FR_COL\", \"TO_COL\"\
          },\n                \"NEXT_SQL_INFO\": {\"SQL_SEQ\", \"SPACE_NM\", \"SQL_ID\", \"TARGET_TABLE\", \"FR_SQL\", \"\
          TO_SQL\", \"STATUS_CONVERSION\", \"STATUS_TUNING\", \"FORMATTED_SQL\"},\n                \"NEXT_MIG_RAG_INFO\":\
          \ {\"RAG_ID\", \"CATEGORY\", \"RULE_TYPE\", \"USE_YN\", \"GUIDANCE_TEXT\"},\n                \"NEXT_MIG_LOG\": {\"\
          LOG_ID\", \"MESSAGE\", \"STATUS\"}}\n    for name, columns in required.items():\n        if not columns <= set(table(state,\
          \ name)[\"columns\"]):\n            raise ValueError(name + \": 필수 컬럼이 없습니다.\")\n    masters = {m[\"MAP_ID\"]: m\
          \ for m in rows(state, \"NEXT_MIG_INFO\")}\n    for m in masters.values():\n        if not isinstance(m[\"MAP_ID\"\
          ], int):\n            raise ValueError(\"MAP_ID는 정수\")\n        src, dst = table(state, m[\"FR_TABLE\"]), table(state,\
          \ m[\"TO_TABLE\"])\n        if not m[\"FR_TABLE\"].startswith(\"ASIS_\") or not m[\"TO_TABLE\"].startswith(\"TOBE_\"\
          ):\n            raise ValueError(\"매핑은 ASIS_ → TOBE_만 지원\")\n        if m.get(\"USE_YN\") not in (\"Y\", \"N\")\
          \ or m.get(\"TRUNC_YN\", \"N\") != \"N\":\n            raise ValueError(\"USE_YN은 Y/N, TRUNC_YN은 N만 지원\")\n    \
          \    prior = m.get(\"PRIOR_MAP_ID\")\n        if prior is not None and prior not in masters:\n            raise\
          \ ValueError(\"없는 선행 MAP_ID\")\n        path, cursor = set(), m[\"MAP_ID\"]\n        while cursor is not None:\n\
          \            if cursor in path:\n                raise ValueError(\"선행 매핑 순환 참조\")\n            path.add(cursor)\n\
          \            cursor = masters[cursor].get(\"PRIOR_MAP_ID\")\n        used = set()\n        for d in rows(state,\
          \ \"NEXT_MIG_INFO_DTL\"):\n            if d[\"MAP_ID\"] != m[\"MAP_ID\"]:\n                continue\n          \
          \  if not isinstance(d[\"MAP_DTL\"], int):\n                raise ValueError(\"MAP_DTL은 정수\")\n            if d.get(\"\
          FR_COL\") not in src[\"columns\"] or d.get(\"TO_COL\") not in dst[\"columns\"]:\n                raise ValueError(\"\
