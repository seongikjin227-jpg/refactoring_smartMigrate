          \            used.add(d[\"TO_COL\"])\n    for d in rows(state, \"NEXT_MIG_INFO_DTL\"):\n        if d[\"MAP_ID\"\
          ] not in masters:\n            raise ValueError(\"상세 규칙에 없는 MAP_ID\")\n    sql_keys = set()\n    for job in rows(state,\
          \ \"NEXT_SQL_INFO\"):\n        if not isinstance(job[\"SQL_SEQ\"], int):\n            raise ValueError(\"SQL_SEQ는\
          \ 정수\")\n        key = (job.get(\"SPACE_NM\"), job.get(\"SQL_ID\"))\n        if None in key or key in sql_keys:\n\
          \            raise ValueError(\"SPACE_NM/SQL_ID 중복 또는 누락\")\n        sql_keys.add(key)\n        scope = [x.strip()\
          \ for x in job.get(\"TARGET_TABLE\", \"\").split(\",\") if x.strip()]\n        if not scope or any(n not in state[\"\
          tables\"] or not n.startswith(\"ASIS_\") for n in scope):\n            raise ValueError(\"TARGET_TABLE은 기존 ASIS\
          \ 테이블 목록이어야 함\")\n    sequences = {j[\"SQL_SEQ\"] for j in rows(state, \"NEXT_SQL_INFO\")}\n    for job in rows(state,\
          \ \"NEXT_SQL_INFO\"):\n        ref = job.get(\"REF_SEQ\")\n        if ref is not None and (ref not in sequences\
          \ or ref == job[\"SQL_SEQ\"]):\n            raise ValueError(\"REF_SEQ는 존재하는 다른 SQL_SEQ여야 합니다.\")\n    for rule\
          \ in rows(state, \"NEXT_MIG_RAG_INFO\"):\n        if rule.get(\"CATEGORY\") not in (\"SQL_CONVERSION\", \"SQL_TUNING\"\
          ) or rule.get(\"RULE_TYPE\") not in (\"GENERAL\", \"SEARCH\") or rule.get(\"USE_YN\") not in (\"Y\", \"N\"):\n \
          \           raise ValueError(\"참고 규칙 CATEGORY/RULE_TYPE/USE_YN 오류\")\n    if len(dumps(state)) > MAX_STATE:\n  \
          \      raise ValueError(\"시연 상태 크기 제한 초과. 로그/SQL을 줄이세요.\")\n    return state\n\n\ndef markdown(state, names, selected_columns=None):\n\
          \    def cell(value):\n        if value is None:\n            return \"—\"\n        return str(value).replace(\"\
          |\", \"&#124;\").replace(\"\\n\", \"<br>\").replace(\"\\r\", \"\")\n    result = []\n    for name in dict.fromkeys(names):\n\
          \        spec = table(state, name)\n        section = [\"### \" + name, \"\"]\n        cols = spec[\"columns\"]\n\
          \        # Wide SQL/log tables: display a useful subset; JSON retains every field.\n        if selected_columns\
          \ and name in selected_columns:\n            cols = selected_columns[name]\n        elif name == \"NEXT_SQL_INFO\"\
          :\n            cols = [\"SQL_SEQ\", \"SQL_ID\", \"STATUS_CONVERSION\", \"STATUS_TUNING\", \"FR_SQL\", \"TO_SQL\"\
          , \"TUNED_TO_SQL\", \"TUNED_RESULT\", \"FORMATTED_SQL\"]\n        elif name == \"NEXT_MIG_INFO\":\n            cols\
          \ = [\"MAP_ID\", \"FR_TABLE\", \"TO_TABLE\", \"USE_YN\", \"STATUS\"]\n        elif name == \"NEXT_MIG_INFO_DTL\"\
          :\n            cols = [\"MAP_ID\", \"MAP_DTL\", \"FR_COL\", \"TO_COL\"]\n        section.append(\"| \" + \" | \"\
          .join(cols) + \" |\")\n        section.append(\"| \" + \" | \".join(\"---\" for _ in cols) + \" |\")\n        for\
          \ row in spec[\"rows\"][-30:]:\n            section.append(\"| \" + \" | \".join(cell(row.get(c)) for c in cols)\
          \ + \" |\")\n        section += [\"\", \"총 \" + str(len(spec[\"rows\"])) + \"행 (최대 30행 표시)\"]\n        result.append(\"\
          \\n\".join(section))\n    return \"\\n\\n\".join(result)\n\n\ndef sql_source_report(state):\n    jobs = rows(state,\
