          , \"BIND_SET\"], \"rows\": jobs}}}\n    lines = [\"SQL 변환 대상 \" + str(len(jobs)) + \"건을 조회했습니다. AS-IS SQL만 표시하며\
          \ 변환·이관·튜닝은 실행하지 않았습니다.\",\n             \"\", markdown(view, [\"NEXT_SQL_INFO\"], {\"NEXT_SQL_INFO\": view[\"tables\"\
