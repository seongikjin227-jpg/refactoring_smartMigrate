          \    if len(unique) != 1:\n        return {\"state_json\": dumps(before), \"answer\": \"한 대화 턴에 서로 다른 Tool 결과가 여러\
          \ 개 반환되어 적용하지 않았습니다. 작업을 하나씩 요청해주세요.\", \"commit_status\": \"CONFLICT\"}\n    item = next(iter(unique.values()))\n\
          \    try:\n        if item.get(\"base_hash\") != digest(before) or item.get(\"base_revision\") != before[\"revision\"\
          ]:\n            raise ValueError(\"Tool의 원본 상태가 현재 대화 상태와 다릅니다.\")\n        after = validate(json.loads(item[\"\
          state_json\"]))\n        if after[\"revision\"] != before[\"revision\"] + 1 or after.get(\"last_request_id\") !=\
          \ request_id:\n            raise ValueError(\"Tool 상태 revision/request_id 불일치\")\n        if item.get(\"status\"\
          ) not in (\"OK\", \"ERROR\", \"NEEDS_INPUT\") or not isinstance(item.get(\"answer\"), str):\n            raise ValueError(\"\
          Tool 결과 형식 오류\")\n        migration_results = item.get(\"migration_results\", [])\n        if not isinstance(migration_results,\
          \ list):\n            raise ValueError(\"migration_results 형식 오류\")\n        return {\"state_json\": dumps(after),\
          \ \"answer\": item[\"answer\"], \"commit_status\": item[\"status\"],\n                \"migration_results\": migration_results,\
          \ \"show_migration_sql\": item.get(\"show_migration_sql\") is True,\n                \"steps\": item.get(\"steps\"\
          , []), \"query_view\": item.get(\"query_view\", \"\")}\n    except (ValueError, KeyError, TypeError) as exc:\n \
          \       return {\"state_json\": dumps(before), \"answer\": \"상태를 적용하지 않았습니다: \" + str(exc), \"commit_status\": \"\
          REJECTED\"}\n\n\ndef general_reply(request):\n    text = re.sub(r\"[\\s?!.,~。]\", \"\", (request or \"\").lower())\n\
          \    if re.search(r\"조회해|실행|진행|변환해|튜닝해|수정해|삭제해|등록해|추가해|내보내\", text):\n        return None\n    if re.fullmatch(r\"\
          안녕(?:하세요|하십니까)?|안녕하세요반가워요|반가워(?:요)?|hi|hello|hey\", text):\n        return \"안녕하세요! SQL깍두기의 SmartMigrate Agent입니다.\
          \ 매핑룰 조회부터 시작하거나 SQL 변환 대상과 튜닝 가이드를 확인할 수 있습니다.\"\n    if re.search(r\"누구|어떤(?:에이전트|agent)|무슨(?:에이전트|agent)|뭐하는(?:에이전트|agent)|너.*소개|자기소개|정체\"\
          , text):\n        return \"저는 SQL깍두기의 SmartMigrate Agent입니다. 확정한 매핑룰을 기준으로 데이터 이관·검증, AS-IS SQL의 TO-BE 변환, 규칙 기반\
          \ 튜닝을 돕습니다. 현재 Dify 시연은 실제 DB 대신 JSON 샘플로 동작합니다.\"\n    if re.search(r\"어떤기능|무슨기능|기능.*(?:있|알려|소개)|할수있|할수잇|사용법|도움말|help\"\
          , text):\n        return (\"매핑룰 조회·관리, JSON 데이터 이관과 COUNT·CONCAT 비교, SQL 변환 대상 조회, SQL Conversion, 튜닝 가이드 조회·적용을\
          \ 지원합니다. \"\n                \"두 테이블 조인과 바인드가 있는 SQL 한 개로 시연하며, 요청한 작업만 실행합니다. ‘매핑룰 조회해줘’ 또는 ‘SQL 변환 대상 조회해줘’로 시작해\
          \ 보세요.\")\n    return None\n\n\ndef main(state_json: str, request_id: str, agent_json: list, agent_text: str, execution_json:\
          \ str = None, user_request: str = \"\") -> dict:\n    reply = general_reply(user_request)\n    if reply:\n     \
          \   before = validate(json.loads(state_json))\n        facts = {\"commit_status\": \"CHAT\", \"verified\": False,\
          \ \"summary\": reply, \"suggested_requests\": [], \"general_chat\": True}\n        return {\"state_json\": dumps(before),\
          \ \"answer\": reply, \"commit_status\": \"CHAT\", \"narrative_json\": dumps(facts)}\n    result = commit_result(state_json,\
          \ request_id, agent_json, agent_text, execution_json)\n    # A missing Agent call cannot be repaired inside the\
          \ Workflow Tool. For this\n    # exact read-only request, show the already validated conversation snapshot.\n  \
          \  # Never use this path for writes or when a Tool response was received.\n    if (execution_json is None and result[\"\
          commit_status\"] == \"NO_RESULT\"\n            and not tool_responses(agent_json) and not (agent_text or \"\").strip()\n\
          \            and is_sql_source_query(user_request)):\n        before = validate(json.loads(state_json))\n      \
          \  answer = sql_source_report(before) + \"\\n\\n조회 경로: 현재 대화의 JSON 상태. 이번 턴에 Agent Tool 호출은 발생하지 않았습니다.\"\n    \
          \    facts = {\"commit_status\": \"READ_ONLY\", \"verified\": True, \"summary\": \"NEXT_SQL_INFO의 FR_SQL을 현재 상태에서\
          \ 조회했습니다.\",\n                 \"sql_source_query\": {\"table\": \"NEXT_SQL_INFO\", \"count\": len(rows(before,\
          \ \"NEXT_SQL_INFO\")), \"column\": \"FR_SQL\"},\n                 \"execution_source\": \"conversation_state\",\
          \ \"tool_called\": False}\n        return {\"state_json\": dumps(before), \"answer\": answer, \"commit_status\"\
          : \"READ_ONLY\", \"narrative_json\": dumps(facts)}\n    facts = {\"commit_status\": result[\"commit_status\"], \"\
          verified\": False,\n             \"summary\": result[\"answer\"], \"suggested_requests\": [],\n             \"execution_environment\"\
          : \"JSON 테이블 시연. Oracle DB에서 실행하지 않음.\"}\n    if result.get(\"tool_diagnostic\"):\n        facts[\"tool_diagnostic\"\
          ] = result[\"tool_diagnostic\"]\n    if result[\"commit_status\"] in (\"OK\", \"ERROR\", \"NEEDS_INPUT\"):\n   \
          \     facts[\"verified\"] = True\n    if result[\"commit_status\"] == \"OK\":\n        state = json.loads(result[\"\
          state_json\"])\n        executed = result.get(\"migration_results\", [])\n        names = [name for name in re.findall(r\"\
          ^### ([A-Z][A-Z0-9_]*)\\s*$\", result[\"answer\"], re.M)\n                 if name in state[\"tables\"]]\n     \
          \   if executed:\n            # Data tables are rendered once in migration_report below.\n            data_names\
          \ = {m[field] for m in rows(state, \"NEXT_MIG_INFO\")\n                          if m[\"MAP_ID\"] in {r[\"MAP_ID\"\
          ] for r in executed} for field in (\"FR_TABLE\", \"TO_TABLE\")}\n            names = [name for name in names if\
          \ name not in data_names]\n        if names and not result.get(\"steps\") and result.get(\"query_view\") != \"sql_source\"\
          :\n            prefix = result[\"answer\"].split(\"### \", 1)[0].strip()\n            # Regenerate tables from verified\
          \ state, including old Tool versions\n            # that put blank lines between every Markdown table row.\n   \
          \         result[\"answer\"] = prefix + \"\\n\\n\" + markdown(state, names)\n            facts[\"summary\"] = prefix\n\
          \            facts[\"displayed_tables\"] = [{\"table\": name, \"row_count\": len(rows(state, name))} for name in\
          \ dict.fromkeys(names)]\n        if result.get(\"query_view\") == \"sql_source\":\n            result[\"answer\"\
          ] = sql_source_report(state)\n            facts[\"sql_source_query\"] = {\"table\": \"NEXT_SQL_INFO\", \"count\"\
          : len(rows(state, \"NEXT_SQL_INFO\")), \"column\": \"FR_SQL\"}\n            facts[\"summary\"] = \"NEXT_SQL_INFO의\
          \ AS-IS SQL 대상 \" + str(len(rows(state, \"NEXT_SQL_INFO\"))) + \"건 조회. 변환·이관·튜닝 실행 없음.\"\n        elif result.get(\"\
          steps\"):\n            facts[\"steps\"] = result[\"steps\"]\n            facts[\"summary\"] = \"요청한 작업을 순서대로 처리했습니다.\
          \ \" + dumps(result[\"steps\"])\n        elif executed:\n            result[\"answer\"] += \"\\n\\n\" + migration_report(state,\
