app:
  name: SmartMigrate 통합 실행
  description: DB 없는 SmartMigrate 대화형 시연
  mode: workflow
  icon: 🔄
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 작업 실행, 매핑룰 변경, 결과 조회를 요청해주세요.
    suggested_questions:
    - 안녕, 어떤 에이전트야?
    - 매핑룰 조회해줘
    - DB Migration 실행해줘
    - SQL 변환 대상 조회해줘
    - SQL 변환 실행해줘
    - SQL 튜닝룰 조회해줘
    - SQL 튜닝 실행해줘
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 100
      data:
        type: start
        title: 요청·현재 테이블
        desc: ''
        selected: false
        variables:
        - variable: request
          label: request
          type: paragraph
          required: true
          max_length: 200000
          options: []
        - variable: session_json
          label: session_json
          type: paragraph
          required: true
          max_length: 200000
          options: []
    - id: prepare
      type: custom
      position:
        x: 310
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 100
      data:
        type: code
        title: 상태 확인·참고 규칙 선택
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"Dify Code node: standard library only, JSON tables, no database or network.\n\nThe builder embeds this\
          \ whole file in the execute node. Do not import local modules.\n\"\"\"\nimport copy\nimport base64\nimport hashlib\n\
          import json\nimport re\n\nMAX_STATE = 180000\nMAX_ROWS = 200\nRESULT_KIND = \"smartmigrate.result.v1\"\nTABLE_INPUTS\
          \ = {name: name.lower() + \"_json\" for name in (\n    \"ASIS_HR_DEPT\", \"ASIS_HR_EMP\", \"TOBE_HR_DEPT\", \"TOBE_HR_EMP\"\
          , \"NEXT_MIG_INFO\",\n    \"NEXT_MIG_INFO_DTL\", \"NEXT_SQL_INFO\", \"NEXT_MIG_RAG_INFO\", \"NEXT_MIG_LOG\")}\n\n\
          \ndef dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(\",\", \":\"), allow_nan=False)\n\
          \n\ndef digest(value):\n    canonical = json.dumps(value, ensure_ascii=False, separators=(\",\", \":\"), sort_keys=True,\
          \ allow_nan=False)\n    return hashlib.sha256(canonical.encode(\"utf-8\")).hexdigest()\n\n\ndef table(state, name):\n\
          \    if name not in state[\"tables\"]:\n        raise ValueError(\"없는 테이블: \" + str(name))\n    return state[\"\
          tables\"][name]\n\n\ndef rows(state, name):\n    return table(state, name)[\"rows\"]\n\n\ndef validate(state):\n\
          \    if not isinstance(state, dict) or state.get(\"schema_version\") != 1:\n        raise ValueError(\"schema_version=1인\
          \ 샘플 JSON이 필요합니다.\")\n    if not isinstance(state.get(\"revision\"), int) or state[\"revision\"] < 0:\n        raise\
          \ ValueError(\"revision은 0 이상의 정수여야 합니다.\")\n    if not isinstance(state.get(\"tables\"), dict):\n        raise\
          \ ValueError(\"tables 객체가 필요합니다.\")\n    names = (\"NEXT_MIG_INFO\", \"NEXT_MIG_INFO_DTL\", \"NEXT_SQL_INFO\", \"\
          NEXT_MIG_RAG_INFO\", \"NEXT_MIG_LOG\")\n    for name in names:\n        table(state, name)\n    for name, spec in\
          \ state[\"tables\"].items():\n        if not isinstance(spec, dict):\n            raise ValueError(name + \": 테이블\
          \ 정의 오류\")\n        cols, data = spec.get(\"columns\"), spec.get(\"rows\")\n        if not isinstance(cols, list)\
          \ or not cols or not all(isinstance(c, str) for c in cols) or len(set(cols)) != len(cols):\n            raise ValueError(name\
          \ + \": columns 오류\")\n        if not all(isinstance(c, str) and re.fullmatch(r\"[A-Z][A-Z0-9_]*\", c) for c in\
          \ cols):\n            raise ValueError(name + \": 컬럼명 오류\")\n        if not isinstance(data, list) or len(data)\
          \ > MAX_ROWS:\n            raise ValueError(name + \": 행 수 제한 200\")\n        keys = spec.get(\"primary_key\", [])\n\
          \        if not isinstance(keys, list) or not keys or not all(isinstance(k, str) for k in keys) or not set(keys)\
          \ <= set(cols):\n            raise ValueError(name + \": primary_key 오류\")\n        seen = set()\n        for row\
          \ in data:\n            if not isinstance(row, dict) or set(row) - set(cols):\n                raise ValueError(name\
          \ + \": 선언하지 않은 컬럼\")\n            if any(isinstance(v, (dict, list)) for v in row.values()):\n                raise\
          \ ValueError(name + \": 셀은 문자열/숫자/null/bool만 지원\")\n            key = tuple(row.get(k) for k in keys)\n        \
          \    if any(v is None for v in key) or key in seen:\n                raise ValueError(name + \": 중복 또는 빈 키 \" +\
          \ str(key))\n            seen.add(key)\n    required = {\"NEXT_MIG_INFO\": {\"MAP_ID\", \"FR_TABLE\", \"TO_TABLE\"\
          , \"STATUS\", \"USE_YN\"},\n                \"NEXT_MIG_INFO_DTL\": {\"MAP_ID\", \"MAP_DTL\", \"FR_COL\", \"TO_COL\"\
          },\n                \"NEXT_SQL_INFO\": {\"SQL_SEQ\", \"SPACE_NM\", \"SQL_ID\", \"TARGET_TABLE\", \"FR_SQL\", \"\
          TO_SQL\", \"STATUS_CONVERSION\", \"STATUS_TUNING\", \"FORMATTED_SQL\"},\n                \"NEXT_MIG_RAG_INFO\":\
          \ {\"RAG_ID\", \"CATEGORY\", \"RULE_TYPE\", \"USE_YN\", \"GUIDANCE_TEXT\"},\n                \"NEXT_MIG_LOG\": {\"\
          LOG_ID\", \"MESSAGE\", \"STATUS\"}}\n    for name, columns in required.items():\n        if not columns <= set(table(state,\
          \ name)[\"columns\"]):\n            raise ValueError(name + \": 필수 컬럼이 없습니다.\")\n    masters = {m[\"MAP_ID\"]: m\
          \ for m in rows(state, \"NEXT_MIG_INFO\")}\n    for m in masters.values():\n        if not isinstance(m[\"MAP_ID\"\
          ], int):\n            raise ValueError(\"MAP_ID는 정수\")\n        src, dst = table(state, m[\"FR_TABLE\"]), table(state,\
          \ m[\"TO_TABLE\"])\n        if not m[\"FR_TABLE\"].startswith(\"ASIS_\") or not m[\"TO_TABLE\"].startswith(\"TOBE_\"\
          ):\n            raise ValueError(\"매핑은 ASIS_ → TOBE_만 지원\")\n        if m.get(\"USE_YN\") not in (\"Y\", \"N\")\
          \ or m.get(\"TRUNC_YN\", \"N\") != \"N\":\n            raise ValueError(\"USE_YN은 Y/N, TRUNC_YN은 N만 지원\")\n    \
          \    prior = m.get(\"PRIOR_MAP_ID\")\n        if prior is not None and prior not in masters:\n            raise\
          \ ValueError(\"없는 선행 MAP_ID\")\n        path, cursor = set(), m[\"MAP_ID\"]\n        while cursor is not None:\n\
          \            if cursor in path:\n                raise ValueError(\"선행 매핑 순환 참조\")\n            path.add(cursor)\n\
          \            cursor = masters[cursor].get(\"PRIOR_MAP_ID\")\n        used = set()\n        for d in rows(state,\
          \ \"NEXT_MIG_INFO_DTL\"):\n            if d[\"MAP_ID\"] != m[\"MAP_ID\"]:\n                continue\n          \
          \  if not isinstance(d[\"MAP_DTL\"], int):\n                raise ValueError(\"MAP_DTL은 정수\")\n            if d.get(\"\
          FR_COL\") not in src[\"columns\"] or d.get(\"TO_COL\") not in dst[\"columns\"]:\n                raise ValueError(\"\
          매핑에 없는 원천/대상 컬럼\")\n            if d[\"TO_COL\"] in used:\n                raise ValueError(\"한 매핑에 중복 대상 컬럼\")\n\
          \            used.add(d[\"TO_COL\"])\n    for d in rows(state, \"NEXT_MIG_INFO_DTL\"):\n        if d[\"MAP_ID\"\
          ] not in masters:\n            raise ValueError(\"상세 규칙에 없는 MAP_ID\")\n    sql_keys = set()\n    for job in rows(state,\
          \ \"NEXT_SQL_INFO\"):\n        if not isinstance(job[\"SQL_SEQ\"], int):\n            raise ValueError(\"SQL_SEQ는\
          \ 정수\")\n        key = (job.get(\"SPACE_NM\"), job.get(\"SQL_ID\"))\n        if None in key or key in sql_keys:\n\
          \            raise ValueError(\"SPACE_NM/SQL_ID 중복 또는 누락\")\n        sql_keys.add(key)\n        scope = [x.strip()\
          \ for x in job.get(\"TARGET_TABLE\", \"\").split(\",\") if x.strip()]\n        if not scope or any(n not in state[\"\
          tables\"] or not n.startswith(\"ASIS_\") for n in scope):\n            raise ValueError(\"TARGET_TABLE은 기존 ASIS\
          \ 테이블 목록이어야 함\")\n    sequences = {j[\"SQL_SEQ\"] for j in rows(state, \"NEXT_SQL_INFO\")}\n    for job in rows(state,\
          \ \"NEXT_SQL_INFO\"):\n        ref = job.get(\"REF_SEQ\")\n        if ref is not None and (ref not in sequences\
          \ or ref == job[\"SQL_SEQ\"]):\n            raise ValueError(\"REF_SEQ는 존재하는 다른 SQL_SEQ여야 합니다.\")\n    for rule\
          \ in rows(state, \"NEXT_MIG_RAG_INFO\"):\n        if rule.get(\"CATEGORY\") not in (\"SQL_CONVERSION\", \"SQL_TUNING\"\
          ) or rule.get(\"RULE_TYPE\") not in (\"GENERAL\", \"SEARCH\") or rule.get(\"USE_YN\") not in (\"Y\", \"N\"):\n \
          \           raise ValueError(\"참고 규칙 CATEGORY/RULE_TYPE/USE_YN 오류\")\n    if len(dumps(state)) > MAX_STATE:\n  \
          \      raise ValueError(\"시연 상태 크기 제한 초과. 로그/SQL을 줄이세요.\")\n    return state\n\n\ndef markdown(state, names, selected_columns=None):\n\
          \    def cell(value):\n        if value is None:\n            return \"—\"\n        return str(value).replace(\"\
          |\", \"&#124;\").replace(\"\\n\", \"<br>\").replace(\"\\r\", \"\")\n    result = []\n    for name in dict.fromkeys(names):\n\
          \        spec = table(state, name)\n        section = [\"### \" + name, \"\"]\n        cols = spec[\"columns\"]\n\
          \        # Wide SQL/log tables: display a useful subset; JSON retains every field.\n        if selected_columns\
          \ and name in selected_columns:\n            cols = selected_columns[name]\n        elif name == \"NEXT_SQL_INFO\"\
          :\n            cols = [\"SQL_SEQ\", \"SQL_ID\", \"STATUS_CONVERSION\", \"STATUS_TUNING\", \"FR_SQL\", \"TO_SQL\"\
          , \"TUNED_TO_SQL\", \"TUNED_RESULT\", \"FORMATTED_SQL\"]\n        elif name == \"NEXT_MIG_INFO\":\n            cols\
          \ = [\"MAP_ID\", \"FR_TABLE\", \"TO_TABLE\", \"USE_YN\", \"STATUS\"]\n        elif name == \"NEXT_MIG_INFO_DTL\"\
          :\n            cols = [\"MAP_ID\", \"MAP_DTL\", \"FR_COL\", \"TO_COL\"]\n        section.append(\"| \" + \" | \"\
          .join(cols) + \" |\")\n        section.append(\"| \" + \" | \".join(\"---\" for _ in cols) + \" |\")\n        for\
          \ row in spec[\"rows\"][-30:]:\n            section.append(\"| \" + \" | \".join(cell(row.get(c)) for c in cols)\
          \ + \" |\")\n        section += [\"\", \"총 \" + str(len(spec[\"rows\"])) + \"행 (최대 30행 표시)\"]\n        result.append(\"\
          \\n\".join(section))\n    return \"\\n\\n\".join(result)\n\n\ndef sql_source_report(state):\n    jobs = rows(state,\
          \ \"NEXT_SQL_INFO\")\n    view = {\"tables\": {\"NEXT_SQL_INFO\": {\"columns\": [\"SQL_SEQ\", \"SQL_ID\", \"TARGET_TABLE\"\
          , \"BIND_SET\"], \"rows\": jobs}}}\n    lines = [\"SQL 변환 대상 \" + str(len(jobs)) + \"건을 조회했습니다. AS-IS SQL만 표시하며\
          \ 변환·이관·튜닝은 실행하지 않았습니다.\",\n             \"\", markdown(view, [\"NEXT_SQL_INFO\"], {\"NEXT_SQL_INFO\": view[\"tables\"\
          ][\"NEXT_SQL_INFO\"][\"columns\"]})]\n    for job in jobs[:30]:\n        lines += [\"\", \"### SQL_SEQ \" + str(job[\"\
          SQL_SEQ\"]) + \" · FR_SQL (AS-IS)\", \"\", \"```sql\", job[\"FR_SQL\"], \"```\"]\n    return \"\\n\".join(lines)\n\
          \n\ndef is_sql_source_query(request):\n    text = request.lower()\n    return (requested_stages(request) == {\"\
          query\"} and \"sql\" in text\n            and bool(re.search(r\"대상|as[-_ ]?is|원본|샘플\", text))\n            and not\
          \ re.search(r\"결과|to[-_ ]?be|튜닝\", text))\n\n\ndef log(state, action, status, message):\n    data = rows(state,\
          \ \"NEXT_MIG_LOG\")\n    ident = max([r[\"LOG_ID\"] for r in data] + [0]) + 1\n    data.append({\"LOG_ID\": ident,\
          \ \"MAP_ID\": None, \"MIG_KIND\": action, \"LOG_TYPE\": \"DEMO\",\n                 \"LOG_LEVEL\": \"INFO\" if status\
          \ == \"OK\" else \"WARN\", \"STEP_NAME\": action,\n                 \"STATUS\": status, \"MESSAGE\": message, \"\
          RETRY_COUNT\": 0, \"GENERATE_SQL\": None,\n                 \"CREATED_AT\": \"TURN-\" + str(state[\"revision\"]\
          \ + 1)})\n    del data[:-30]\n\n\ndef invalidate(state):\n    for m in rows(state, \"NEXT_MIG_INFO\"):\n       \
          \ m[\"STATUS\"] = \"STALE\"\n    for job in rows(state, \"NEXT_SQL_INFO\"):\n        job[\"STATUS_CONVERSION\"]\
          \ = \"STALE\"\n        job[\"STATUS_TUNING\"] = \"STALE\"\n        job[\"LOG\"] = \"매핑 또는 SQL 변경: 이전 산출물은 이력이며 재생성\
          \ 필요\"\n\n\ndef select_one(state, name, key):\n    spec = table(state, name)\n    if not isinstance(key, dict) or\
          \ set(key) != set(spec[\"primary_key\"]):\n        raise ValueError(\"정확한 기본 키가 필요합니다: \" + \", \".join(spec[\"\
          primary_key\"]))\n    found = [r for r in spec[\"rows\"] if all(r.get(k) == v for k, v in key.items())]\n    if\
          \ len(found) != 1:\n        raise ValueError(\"대상 행이 없습니다: \" + dumps(key))\n    return found[0]\n\n\ndef manage(state,\
          \ plan):\n    action, name = plan[\"action\"], plan.get(\"table\")\n    editable = {\"NEXT_MIG_INFO\", \"NEXT_MIG_INFO_DTL\"\
          , \"NEXT_SQL_INFO\", \"NEXT_MIG_RAG_INFO\"}\n    if name not in editable:\n        raise ValueError(\"관리 대상은 매핑·SQL\
          \ 작업·참고 규칙 테이블입니다.\")\n    spec = table(state, name)\n    if action == \"insert\":\n        value = plan.get(\"\
          values\", {})\n        if not isinstance(value, dict) or not value:\n            raise ValueError(\"추가할 values가\
          \ 필요합니다.\")\n        default = {\"USE_YN\": \"Y\", \"PRIORITY\": 5, \"TRUNC_YN\": \"N\", \"MAP_TYPE\": \"SIMPLE\"\
          , \"USER_EDITED\": \"N\", \"BATCH_CNT\": 0, \"RETRY_COUNT\": 0}\n        row = {c: default.get(c) for c in spec[\"\
          columns\"]}\n        row.update(value)\n        spec[\"rows\"].append(row)\n        key = {c: row.get(c) for c in\
          \ spec[\"primary_key\"]}\n    else:\n        key = plan.get(\"key\", {})\n        row = select_one(state, name,\
          \ key)\n        if action == \"update\":\n            value = plan.get(\"values\", {})\n            if not isinstance(value,\
          \ dict) or not value or set(value) & set(spec[\"primary_key\"]):\n                raise ValueError(\"수정값이 없거나 기본\
          \ 키 변경 요청입니다.\")\n            allowed = {\n                \"NEXT_MIG_INFO\": {\"FR_TABLE\", \"TO_TABLE\", \"CONDITION\"\
          , \"USE_YN\", \"PRIORITY\", \"PRIOR_MAP_ID\", \"STATUS\"},\n                \"NEXT_MIG_INFO_DTL\": {\"FR_COL\",\
          \ \"TO_COL\"},\n                \"NEXT_SQL_INFO\": {\"FR_SQL\", \"EDIT_FR_SQL\", \"TO_SQL\", \"TUNED_TO_SQL\", \"\
          FORMATTED_SQL\", \"STATUS_CONVERSION\", \"STATUS_TUNING\", \"PRIORITY\", \"TARGET_TABLE\"},\n                \"\
          NEXT_MIG_RAG_INFO\": {\"CATEGORY\", \"RULE_TYPE\", \"SOURCE_TABLES\", \"USE_YN\", \"GUIDANCE_TEXT\", \"SOURCE_SQL\"\
          , \"TARGET_SQL\"},\n            }\n            if set(value) - allowed[name]:\n                raise ValueError(\"\
          수정이 허용되지 않은 컬럼\")\n            row.update(value)\n        elif action == \"delete\":\n            if name == \"\
          NEXT_MIG_INFO\":\n                if any(m.get(\"PRIOR_MAP_ID\") == row[\"MAP_ID\"] for m in rows(state, name)):\n\
          \                    raise ValueError(\"다른 매핑이 참조 중입니다. 선행 매핑 관계를 먼저 변경하세요.\")\n                rows(state, \"NEXT_MIG_INFO_DTL\"\
          )[:] = [d for d in rows(state, \"NEXT_MIG_INFO_DTL\") if d[\"MAP_ID\"] != row[\"MAP_ID\"]]\n            if name\
          \ == \"NEXT_SQL_INFO\" and any(j.get(\"REF_SEQ\") == row[\"SQL_SEQ\"] for j in rows(state, name)):\n           \
          \     raise ValueError(\"REF_SEQ에서 참조 중인 SQL입니다.\")\n            spec[\"rows\"].remove(row)\n        else:\n   \
          \         raise ValueError(\"지원하지 않는 관리 action\")\n    mapping_change = name.startswith(\"NEXT_MIG_INFO\") and not\
          \ (action == \"update\" and set(plan[\"values\"]) <= {\"STATUS\"})\n    if mapping_change:\n        invalidate(state)\n\
          \    elif name == \"NEXT_SQL_INFO\" and action == \"update\":\n        if set(plan.get(\"values\", {})) & {\"FR_SQL\"\
          , \"EDIT_FR_SQL\", \"TARGET_TABLE\", \"TO_SQL\", \"TUNED_TO_SQL\"}:\n            row[\"STATUS_CONVERSION\"] = \"\
          STALE\"\n            row[\"STATUS_TUNING\"] = \"STALE\"\n    elif name == \"NEXT_MIG_RAG_INFO\":\n        for job\
          \ in rows(state, \"NEXT_SQL_INFO\"):\n            if job.get(\"STATUS_TUNING\"):\n                job[\"STATUS_TUNING\"\
          ] = \"STALE\"\n                job[\"FORMATTED_SQL\"] = None\n    state[\"last_target\"] = {\"table\": name, \"\
          key\": key}\n    state[\"pending_action\"] = None\n    return [name] + ([\"NEXT_MIG_INFO_DTL\"] if name == \"NEXT_MIG_INFO\"\
          \ else []), action + \": \" + name + \" \" + dumps(key)\n\n\ndef filtered(data, condition):\n    if not condition\
          \ or not condition.strip():\n        return data\n    # Deliberately small condition language; never eval source\
          \ text.\n    m = re.fullmatch(r\"\\s*([A-Z][A-Z0-9_]*)\\s*(=|>=|<=|>|<|!=)\\s*('(?:[^']|'')*'|-?\\d+(?:\\.\\d+)?)\\\
          s*\", condition)\n    if not m:\n        raise ValueError(\"CONDITION은 단일 컬럼 비교만 지원합니다.\")\n    col, op, text =\
          \ m.groups()\n    value = text[1:-1].replace(\"''\", \"'\") if text.startswith(\"'\") else float(text)\n    checks\
          \ = {\"=\": lambda a: a == value, \"!=\": lambda a: a != value,\n              \">\": lambda a: a > value, \"<\"\
          : lambda a: a < value,\n              \">=\": lambda a: a >= value, \"<=\": lambda a: a <= value}\n    if any(col\
          \ not in r for r in data):\n        raise ValueError(\"CONDITION에 없는 컬럼\")\n    return [r for r in data if r[col]\
          \ is not None and checks[op](r[col])]\n\n\ndef row_concat(record, columns):\n    # Length-prefix JSON tokens so\
          \ delimiters, null, empty text and types cannot collide.\n    tokens = [dumps(record.get(column)) for column in\
          \ columns]\n    return \"\".join(str(len(token)) + \":\" + token for token in tokens)\n\n\ndef migration_verification(state,\
          \ mapping):\n    details = sorted([d for d in rows(state, \"NEXT_MIG_INFO_DTL\") if d[\"MAP_ID\"] == mapping[\"\
          MAP_ID\"]], key=lambda d: d[\"MAP_DTL\"])\n    columns = [d[\"TO_COL\"] for d in details]\n    spec = table(state,\
          \ mapping[\"TO_TABLE\"])\n    keys = spec[\"primary_key\"]\n    source = [{d[\"TO_COL\"]: row.get(d[\"FR_COL\"])\
          \ for d in details}\n              for row in filtered(rows(state, mapping[\"FR_TABLE\"]), mapping.get(\"CONDITION\"\
          ))]\n    expected = {tuple(row.get(k) for k in keys): row for row in source}\n    actual = {tuple(row.get(k) for\
          \ k in keys): row for row in spec[\"rows\"]}\n    scoped = {key: actual[key] for key in expected if key in actual}\n\
          \    column_counts = [{\"column\": column, \"source\": sum(r.get(column) is not None for r in source),\n       \
          \               \"target\": sum(r.get(column) is not None for r in scoped.values())} for column in columns]\n  \
          \  matched, mismatches = 0, []\n    for key, record in expected.items():\n        target = scoped.get(key)\n   \
          \     if target is not None and row_concat(record, columns) == row_concat(target, columns):\n            matched\
          \ += 1\n        else:\n            mismatches.append({\"key\": list(key), \"columns\": columns if target is None\
          \ else\n                [column for column in columns if dumps(record.get(column)) != dumps(target.get(column))]})\n\
          \    count_pass = len(source) == len(scoped) and all(c[\"source\"] == c[\"target\"] for c in column_counts)\n  \
          \  return {\"count_result\": \"PASS\" if count_pass else \"FAIL\", \"source_count\": len(source),\n            \"\
          target_count\": len(scoped), \"target_total_count\": len(spec[\"rows\"]),\n            \"preserved_extra_rows\"\
          : len(actual) - len(scoped), \"column_counts\": column_counts,\n            \"concat_result\": \"PASS\" if not mismatches\
          \ else \"FAIL\", \"matched_count\": matched,\n            \"mismatch_count\": len(mismatches), \"mismatches\": mismatches[:10],\n\
